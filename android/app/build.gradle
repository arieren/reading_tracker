import java.util.Properties
import java.io.FileInputStream
import groovy.json.JsonSlurper

plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id 'com.google.gms.google-services'
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "edu.cpp.reading_tracker"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    defaultConfig {
        applicationId = "edu.cpp.reading_tracker"
        minSdkVersion = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    flavorDimensions += "environment"
    productFlavors {
        production {
            dimension = "environment"
            resValue "string", "app_name", "Reading Tracker"
        }
        staging {
            dimension = "environment"
            applicationIdSuffix = ".staging"
            resValue "string", "app_name", "Reading Tracker Test"
        }
    }

    buildFeatures {
        resValues = true
    }

    signingConfigs {
        create("release") {
            keyAlias = keystoreProperties["keyAlias"] as String
            keyPassword = keystoreProperties["keyPassword"] as String
            storeFile = keystoreProperties["storeFile"] ? file(keystoreProperties["storeFile"]) : null
            storePassword = keystoreProperties["storePassword"] as String
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.getByName("release")
        }
    }
}

tasks.configureEach { task ->
    if (task.name.startsWith("processStaging") && task.name.endsWith("GoogleServices")) {
        task.doFirst {
            def configFile = file("src/staging/google-services.json")
            if (!configFile.exists()) {
                throw new GradleException("Register edu.cpp.reading_tracker.staging in reading-tracker-test-a734e and place its google-services.json in android/app/src/staging/.")
            }
            def config = new JsonSlurper().parse(configFile)
            if (config.project_info.project_id != "reading-tracker-test-a734e") {
                throw new GradleException("Staging must use Firebase project reading-tracker-test-a734e.")
            }
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
    }
}

flutter {
    source = "../.."
}
